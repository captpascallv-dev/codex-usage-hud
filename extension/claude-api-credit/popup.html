<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Claude API赠送额度</title>
  <style>
    body { margin: 0; font: 13px/1.4 "Segoe UI", sans-serif; color: #1c2430; background: #f7f4ee; }
    main { width: 280px; padding: 14px; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    p { margin: 0 0 8px; }
    button { width: 100%; height: 32px; border: 0; border-radius: 8px; background: #1f6b4a; color: white; font-weight: 600; }
    button.stop { background: #6b3b2a; }
    .meta { color: #5c6570; }
  </style>
</head>
<body>
  <main>
    <h1>Claude API赠送额度</h1>
    <p id="state">未开始</p>
    <p id="amount">没有读数</p>
    <p id="observed" class="meta"></p>
    <p class="meta">开始后，扩展只保留自己打开的账单页后台标签，并每 5 分钟按页面真实加载重新读取。停止后关闭这个标签。不会操作你已经打开的标签，也不会购买、填表或登录。</p>
    <button id="toggle" type="button">开始同步</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
